<style>
body{margin:0;background:#0F0F0E}
a{color:#F2EEE7}a:hover{color:#E8A33D}
.k2 *{box-sizing:border-box}

.k2 input{font:inherit}
.k2 .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.k2-burger,.k2-mbar,.k2-drawer{display:none}
@keyframes k2marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.k2-marq-in{display:flex;gap:28px;width:max-content;animation:k2marq 28s linear infinite}
@media (prefers-reduced-motion:reduce){.k2-marq-in{animation:none}}
@media (max-width:960px){
.k2-nav{display:none !important}
.k2-strip{display:none !important}
.k2-h1{font-size:44px !important}
.k2-h2{font-size:32px !important}

.k2-drawer{display:flex}
}
@media (max-width:700px){

.k2-hero{min-height:calc(100svh - 120px) !important;border-radius:24px !important}

.k2-book-txt{display:none}
.k2-hero-t{padding:28px 20px 0 !important}
.k2-h1{font-size:40px !important;line-height:1.04 !important}
.k2-hero-b{padding:0 20px 22px !important;gap:18px !important}
.k2-hero-b p{display:none}
.k2-sec{padding:44px 0 36px !important;border-radius:24px !important;margin-top:8px !important}
.k2-pad{padding-left:20px !important;padding-right:20px !important}
.k2-tabs{display:flex !important;flex-wrap:nowrap !important;justify-content:flex-start !important;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:0 20px;box-sizing:border-box}
.k2-tabs::-webkit-scrollbar,.k2-rail::-webkit-scrollbar{display:none}
.k2-tabs button{flex:0 0 auto}
.k2-rail{display:flex !important;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px !important;padding:0 20px !important;scrollbar-width:none;align-items:stretch !important}
.k2-rail>*{flex:0 0 78%;scroll-snap-align:center}
.k2-cimg{height:340px !important}
.k2-stories{padding:36px 20px !important;gap:24px !important}
.k2-stories .k2-tall{min-height:360px !important}
.k2-steps{grid-template-columns:1fr !important}
.k2-steps>div{border-right:0 !important;border-top:1px solid #D7D0C4;padding:22px 20px !important;display:grid;grid-template-columns:52px 1fr;column-gap:8px}
.k2-steps>div>*{grid-column:2}
.k2-steps>div>div:first-child{grid-column:1;grid-row:1 / span 2;font-size:22px !important}
.k2-steps>div>div:nth-child(2){margin-top:0 !important}
.k2-steps>div:first-child{display:block}
.k2-book-h{padding:40px 20px 16px !important}
.k2-marq{padding:14px 0 !important;font-size:19px !important}
.k2-foot{padding:40px 20px 24px !important;border-radius:24px !important;margin-top:8px !important}
.k2-mbar{display:flex;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;gap:8px;padding:8px;border-radius:999px;background:rgba(20,19,18,0.92);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,0.35)}
}

/* ---- tiny renderer for the design templates ---- */
const HOLE=/\{\{\s*([^}]+?)\s*\}\}/g, WHOLE=/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
function look(p,sc){p=p.trim();if(p==='true')return true;if(p==='false')return false;if(/^-?\d+(\.\d+)?$/.test(p))return +p;let v=sc;for(const k of p.split('.')){if(v==null)return undefined;v=v[k];}return v;}
function interp(s,sc){return s.replace(HOLE,(m,p)=>{const v=look(p,sc);return v==null?'':String(v);});}
function fixImg(s){return s.indexOf('/_blob/')<0?s:s.replace(/\/_blob\/([0-9a-f]{32})/g,(m,id)=>IMG[id]||m);}
const SVG='http://www.w3.org/2000/svg';
function build(node,sc,doc,out){
  if(node.nodeType===3){out.push(doc.createTextNode(interp(node.nodeValue,sc)));return;}
  if(node.nodeType!==1)return;
  const tag=node.localName;
  if(tag==='sc-for'){const m=WHOLE.exec(node.getAttribute('list')||'');const list=(m&&look(m[1],sc))||[];const as=node.getAttribute('as');
    list.forEach((it,i)=>{const s2=Object.create(sc);s2[as]=it;s2.$index=i;node.childNodes.forEach(c=>build(c,s2,doc,out));});return;}
  if(tag==='sc-if'){const m=WHOLE.exec(node.getAttribute('value')||'');if(m&&look(m[1],sc))node.childNodes.forEach(c=>build(c,sc,doc,out));return;}
  const el=node.namespaceURI===SVG?doc.createElementNS(SVG,node.localName):doc.createElement(tag);
  for(const a of Array.from(node.attributes)){
    const n=a.name,val=a.value;
    if(n.startsWith('hint-'))continue;
    if(n.startsWith('on')){const m=WHOLE.exec(val);if(m){const fn=look(m[1],sc);if(typeof fn==='function')el.addEventListener(n.slice(2),e=>fn(e));}continue;}
    const m=WHOLE.exec(val);let v;
    if(m){const r=look(m[1],sc);v=r==null?'':String(r);}else v=interp(val,sc);
    el.setAttribute(n,fixImg(v));
  }
  if(tag==='a'){const h=el.getAttribute('href')||'';if(/^https?:/.test(h))el.setAttribute('target','_blank');
    if(h.startsWith('#'))el.addEventListener('click',e=>{e.preventDefault();const t=doc.getElementById(h.slice(1));if(t)t.scrollIntoView({behavior:'smooth'});});}
  if(tag==='form')el.addEventListener('submit',e=>e.preventDefault());
  const kids=[];node.childNodes.forEach(c=>build(c,sc,doc,kids));kids.forEach(k=>el.appendChild(k));
  out.push(el);
}

const tpl=document.createElement('template');tpl.innerHTML="\n\n<div class=\"k2\" style=\"font-family:'Manrope',system-ui,sans-serif;color:#F2EEE7;background:#0F0F0E;padding:16px;min-height:100vh\">\n\n<!-- HERO -->\n<section id=\"top\" class=\"k2-hero\" style=\"position:relative;max-width:1400px;margin:0 auto;border-radius:30px;overflow:hidden;min-height:780px;display:flex;flex-direction:column;background:#2A1C17\">\n  <img class=\"ph\" src=\"{{slide.img}}\" alt=\"{{slide.name}}\">\n  <div aria-hidden=\"true\" style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.1) 30%,rgba(0,0,0,0.15) 55%,rgba(0,0,0,0.7) 100%)\"><\/div>\n\n  <header style=\"position:relative;display:flex;justify-content:space-between;align-items:center;padding:24px 28px;gap:16px\">\n    <a href=\"#top\" style=\"text-decoration:none\"><span class=\"k2-serif\" style=\"font-size:34px\">Karin<\/span><span style=\"font-size:12px;letter-spacing:0.2em;margin-left:8px;opacity:0.8\">TRAVEL<\/span><\/a>\n    <nav class=\"k2-nav\" aria-label=\"Main\" style=\"display:flex;gap:2px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:999px;padding:5px;backdrop-filter:blur(10px)\">\n      <a href=\"#top\" style=\"padding:9px 18px;border-radius:999px;background:#F2EEE7;color:#0F0F0E;text-decoration:none;font-size:14px;font-weight:600\">Home<\/a>\n      <a href=\"#tours\" style=\"padding:9px 18px;border-radius:999px;text-decoration:none;font-size:14px\">Tours<\/a>\n      <a href=\"#packages\" style=\"padding:9px 18px;border-radius:999px;text-decoration:none;font-size:14px\">Services<\/a>\n      <a href=\"#book\" style=\"padding:9px 18px;border-radius:999px;text-decoration:none;font-size:14px\">How to book<\/a>\n      <a href=\"#stories\" style=\"padding:9px 18px;border-radius:999px;text-decoration:none;font-size:14px\">Stories<\/a>\n    <\/nav>\n    <div style=\"display:flex;gap:8px;align-items:center\">\n    <a href=\"#packages\" st
